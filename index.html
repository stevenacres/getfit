<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GetFit</title>
  <meta name="theme-color" content="#2a2d5e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GetFit" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">GetFit</div>
    <nav class="tabs">
      <button class="tab is-active" data-view="workout">Workout</button>
      <button class="tab" data-view="history">History</button>
    </nav>
  </header>

  <main id="view"></main>

  <!-- Sticky action bar (timer + save), shown on the Workout view -->
  <div class="actionbar" id="actionbar">
    <div class="timer" id="timer">
      <div class="timer-time" id="timerTime">20:00</div>
      <div class="timer-controls">
        <button id="timerToggle" class="tbtn">Start</button>
        <button id="timerReset" class="tbtn ghost">Reset</button>
      </div>
    </div>
    <button class="save" id="saveBtn">Save workout</button>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/app.js" defer></script>
</body>
</html>
