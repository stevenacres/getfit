<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GetFit</title>
  <meta name="theme-color" content="#060607" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GetFit" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=satoshi@400,500,700,900&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">GetFit</span>
      </a>
      <nav class="tabs">
        <button class="tab is-active" data-view="workout">Workout</button>
        <button class="tab" data-view="history">History</button>
        <button class="tab" data-view="settings">Settings</button>
      </nav>
    </div>
  </header>

  <main id="view"></main>

  <!-- Floating glass dock: 20-minute ring timer + save -->
  <div class="dock" id="actionbar">
    <div class="dock-inner">
      <div class="timer">
        <div class="ring">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <circle class="ring-track" cx="24" cy="24" r="21" />
            <circle class="ring-fill" id="timerRing" cx="24" cy="24" r="21" />
          </svg>
        </div>
        <div class="timer-body">
          <div class="timer-time" id="timerTime">20:00</div>
          <div class="timer-controls">
            <button id="timerToggle" class="tbtn">Start</button>
            <button id="timerReset" class="tbtn ghost">Reset</button>
          </div>
        </div>
      </div>
      <button class="save" id="saveBtn">
        <span>Save workout</span>
      </button>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/app.js" defer></script>
</body>
</html>
